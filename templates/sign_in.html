{% extends 'base.html' %}
{% block title %}Sign In{% endblock %}

{% block body %}
<img src="/static/imgs/pourfolio.jpg" class="login-page" alt="Welcome to Pourfolio">
<div class="centered">
    <div class="login-signup">
        <div class="auth-tabs">
            <button type="button" class="auth-tab active" id="tab-login">Log In</button>
            <button type="button" class="auth-tab" id="tab-signup">Sign Up</button>
        </div>

        <div id="login-panel" class="auth-panel">
            <form action="/login" method="POST">
                <div class="form-line">
                    <label for="login-email">Email:</label>
                    <input id="login-email" type="text" name="email">
                </div>
                <div class="form-line">
                    <label for="login-password">Password:</label>
                    <input id="login-password" type="password" name="password">
                </div>
                <div style="display: flex; justify-content: space-between;">
                    <button type="submit">Sign In</button>
                    <button name="demo" value="true" type="submit">Try Demo</button>
                </div>
            </form>
        </div>

        <div id="signup-panel" class="auth-panel" style="display: none;">
            <form action="/sign_up" method="POST">
                <div class="form-line">
                    <label for="signup-user">Username:</label>
                    <input id="signup-user" type="text" name="user_name">
                </div>
                <div class="form-line">
                    <label for="signup-email">Email:</label>
                    <input id="signup-email" type="text" name="email">
                </div>
                <div class="form-line">
                    <label for="signup-password">Password:</label>
                    <input id="signup-password" type="password" name="password">
                </div>
                <div class="form-line">
                    <button type="submit">Sign Up</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
(function() {
    var tabLogin = document.getElementById('tab-login');
    var tabSignup = document.getElementById('tab-signup');
    var loginPanel = document.getElementById('login-panel');
    var signupPanel = document.getElementById('signup-panel');

    tabLogin.addEventListener('click', function() {
        loginPanel.style.display = '';
        signupPanel.style.display = 'none';
        tabLogin.classList.add('active');
        tabSignup.classList.remove('active');
    });

    tabSignup.addEventListener('click', function() {
        loginPanel.style.display = 'none';
        signupPanel.style.display = '';
        tabSignup.classList.add('active');
        tabLogin.classList.remove('active');
    });
})();
</script>
{% endblock %}

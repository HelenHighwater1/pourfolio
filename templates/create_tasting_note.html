{% extends 'base.html' %}
{% block title %}Tasting Note{% endblock %}

{% block body %}
<div id="notes-grid" style="width: 60%; margin: 0 auto;">
    <div class="tasting-note-page">
        <h3>Create a tasting note for this bottle?</h3>

        <div class="form-container">
            <form action="/create_tasting_note/{{ bottle.bottle_id }}" method="POST">
                <div class="form-line">
                    <label for="note">Tasting Note:</label>
                    <textarea class="form-control" id="note" name="note" rows="4"></textarea>
                </div>
                <div class="form-line">
                    <button type="submit">Submit</button>
                </div>
            </form>
        </div>

        <div class="tasting-note-actions">
            <form action="/lots/{{ bottle.lot_id }}">
                <button type="submit">Skip the tasting note</button>
            </form>
            <form action="/undo_drink_bottle/{{ bottle.bottle_id }}" method="POST">
                <button type="submit" class="btn-pink">Undo drink bottle</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
